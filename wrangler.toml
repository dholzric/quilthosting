name = "quilthosting"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "quilthosting-db"
database_id = "e32d55bf-900a-44fd-ac94-c182f11cc5e2"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "quilthosting-files"

[[kv_namespaces]]
binding = "KV"
id = "7eddc866d7b94b32bab6c40088f099c3"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Local dev overrides these via .dev.vars
[vars]
ENVIRONMENT = "production"
# Stealth phase: workers.dev only; switch to https://quilthosting.com at launch
APP_URL = "https://quilthosting.dholzric.workers.dev"

[triggers]
crons = ["0 8 * * *"]
