name = "quilthosting"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]
# Declaring [[routes]] turns the *.workers.dev subdomain off by default.
# Keep it on so quilthosting.dholzric.workers.dev stays reachable alongside
# the custom domain (site gate still applies to it).
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "quilthosting-db"
database_id = "e32d55bf-900a-44fd-ac94-c182f11cc5e2"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "quilthosting-files"

[[kv_namespaces]]
binding = "KV"
id = "7eddc866d7b94b32bab6c40088f099c3"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "quilthosting.com"
custom_domain = true

# Catch-all so Cloudflare for SaaS custom hostnames hit this Worker
[[routes]]
pattern = "*/*"
zone_name = "quilthosting.com"

# Local dev overrides these via .dev.vars
[vars]
ENVIRONMENT = "production"
APP_URL = "https://quilthosting.com"
# Admin sign-in is Google-only (password login/register return 403; portal magic links still work)
GOOGLE_AUTH_REQUIRED = "true"
# Resend free plan = 1 verified domain (quiltmap.com). Swap at launch.
EMAIL_FROM = "QuiltHosting <noreply@quiltmap.com>"
# Public identifier (not a secret); shared OAuth client with quiltmap/createablock/quiltgen
GOOGLE_CLIENT_ID = "476466840954-53d90qcp82br0o2t8env78vs6q9a3o20.apps.googleusercontent.com"
# Workers custom domains (guild subdomains + zones on this CF account)
CLOUDFLARE_ACCOUNT_ID = "fc9a445b7af4421e2d0c2fd202885f97"
CLOUDFLARE_ZONE_ID = "c6fd07d190feb5b47b3d9ea76e786fdd"
CLOUDFLARE_WORKER_NAME = "quilthosting"
SAAS_CNAME_TARGET = "customers.quilthosting.com"

[[queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "quilthosting-webhooks"

[[queues.consumers]]
queue = "quilthosting-webhooks"
max_batch_size = 10
# 1s, not the 5s default: this is a user-visible trigger latency budget — a Zap
# firing 5s late reads as broken. Batching still kicks in under load.
max_batch_timeout = 1
max_retries = 5
dead_letter_queue = "quilthosting-webhooks-dlq"

[triggers]
# 0 8 * * *  daily jobs (renewals, reminders, blasts, automations)
# * * * * *  outbox sweeper — safety net for rows the queue never acknowledged
crons = ["0 8 * * *", "* * * * *"]
