<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuiltHosting Admin</title>
  <style>
    :root {
      --bg: #faf8f5;
      --surface: #ffffff;
      --text: #1a1a1a;
      --muted: #666;
      --accent: #c45c26;
      --accent-hover: #a34a1c;
      --border: #e5e0d8;
      --success: #2d6a4f;
      --danger: #9b2226;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 220px;
      background: #2c1810;
      color: #f5e6d3;
      padding: 1.5rem 1rem;
      flex-shrink: 0;
    }
    .sidebar h1 {
      font-size: 1.25rem;
      margin-bottom: 1.5rem;
      color: #f5e6d3;
    }
    .sidebar nav a {
      display: block;
      color: #d4c4b0;
      text-decoration: none;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      margin-bottom: 0.25rem;
      font-size: 0.95rem;
    }
    .sidebar nav a:hover, .sidebar nav a.active {
      background: rgba(196, 92, 38, 0.3);
      color: #fff;
    }
    .main { flex: 1; padding: 2rem; max-width: 1100px; }
    h2 { margin-bottom: 1rem; font-size: 1.5rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }
    .stat .label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .stat .value { font-size: 1.75rem; font-weight: 700; margin-top: 0.25rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--border); }
    th { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); letter-spacing: 0.04em; }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge.active { background: #d8f3dc; color: var(--success); }
    .badge.pending { background: #fff3cd; color: #856404; }
    .badge.lapsed, .badge.cancelled { background: #f8d7da; color: var(--danger); }
    .badge.registered { background: #d8f3dc; color: var(--success); }
    .badge.waitlist { background: #fff3cd; color: #856404; }
    .badge.checked_in { background: #caf0f8; color: #0077b6; }
    button, .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }
    button:hover, .btn:hover { background: var(--accent-hover); }
    button.secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    input, select, textarea {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
    }
    label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 0.25rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .hidden { display: none; }
    .login-box {
      max-width: 380px;
      margin: 4rem auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
    }
    .login-box h1 { margin-bottom: 1.5rem; text-align: center; }
    .error { color: var(--danger); font-size: 0.9rem; margin-bottom: 0.75rem; }
    .toolbar { display: flex; gap: 0.75rem; margin-bottom: 1rem; align-items: center; }
    .toolbar input { margin: 0; max-width: 240px; }
  </style>
</head>
<body>
  <!-- Login -->
  <div id="login-view" class="login-box">
    <h1>QuiltHosting</h1>
    <div id="login-error" class="error hidden"></div>
    <div id="password-login">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@guild.org" />
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" />
      <button onclick="doLogin()" style="width:100%;margin-top:0.5rem">Sign In</button>
      <div style="display:flex;align-items:center;gap:0.75rem;margin:1rem 0">
        <hr style="flex:1;border:none;border-top:1px solid var(--border)">
        <span style="font-size:0.8rem;color:var(--muted)">or</span>
        <hr style="flex:1;border:none;border-top:1px solid var(--border)">
      </div>
    </div>
    <a href="/api/auth/google" style="display:flex;align-items:center;justify-content:center;gap:0.5rem;width:100%;padding:0.6rem;border:1px solid var(--border);border-radius:8px;text-decoration:none;color:var(--text);font-size:0.95rem;box-sizing:border-box">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </a>
  </div>

  <!-- Guild picker / first-guild creation -->
  <div id="guild-view" class="login-box hidden">
    <h1>Your Guilds</h1>
    <div id="guild-error" class="error hidden"></div>
    <div id="guild-list"></div>
    <div id="guild-create">
      <p style="margin:0.75rem 0;color:var(--muted);font-size:0.9rem" id="guild-create-intro">
        Create a guild to get started.
      </p>
      <label>Guild name</label>
      <input type="text" id="guild-name" placeholder="Prairie Star Quilt Guild" />
      <label>Web address</label>
      <input type="text" id="guild-slug" placeholder="prairie-star" />
      <p style="font-size:0.8rem;color:var(--muted);margin-top:0.25rem">
        Lowercase letters, numbers and dashes. Used in your public links.
      </p>
      <button onclick="createGuild()" style="width:100%;margin-top:0.75rem">Create Guild</button>
    </div>
    <p style="text-align:center;margin-top:1rem">
      <a href="#" onclick="logout();return false" style="font-size:0.85rem;color:var(--muted)">Log out</a>
    </p>
  </div>

  <!-- App -->
  <div id="app-view" class="layout hidden">
    <aside class="sidebar">
      <h1>QuiltHosting</h1>
      <nav>
        <a href="#" data-page="dashboard" class="active">Dashboard</a>
        <a href="#" data-page="members">Members</a>
        <a href="#" data-page="levels">Levels</a>
        <a href="#" data-page="events">Events</a>
        <a href="#" data-page="settings">Settings</a>
      </nav>
      <div style="margin-top:2rem;font-size:0.8rem;color:#a08060" id="tenant-label"></div>
    </aside>
    <main class="main">
      <div id="page-content"></div>
    </main>
  </div>

  <script>
    const API = window.location.origin;
    let token = localStorage.getItem("gb_token");
    let tenantId = localStorage.getItem("gb_tenant_id");
    let tenantSlug = localStorage.getItem("gb_tenant_slug") || "";
    let tenantName = localStorage.getItem("gb_tenant_name") || "";

    async function api(path, opts = {}) {
      const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
      if (token) headers["Authorization"] = `Bearer ${token}`;
      const res = await fetch(API + path, { ...opts, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function show(el) { el.classList.remove("hidden"); }
    function hide(el) { el.classList.add("hidden"); }

    async function doLogin() {
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;
      const errEl = document.getElementById("login-error");
      hide(errEl);
      try {
        const data = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ email, password }),
        });
        token = data.token;
        localStorage.setItem("gb_token", token);
        await enterApp();
      } catch (e) {
        errEl.textContent = e.message;
        show(errEl);
      }
    }

    function selectGuild(t) {
      tenantId = t.id;
      tenantSlug = t.slug;
      tenantName = t.name;
      localStorage.setItem("gb_tenant_id", t.id);
      localStorage.setItem("gb_tenant_slug", t.slug);
      localStorage.setItem("gb_tenant_name", t.name);
      hide(document.getElementById("guild-view"));
      initApp();
    }

    // After sign-in: auto-select the only guild, or show a picker /
    // first-guild creation form. No IDs are ever shown to the user.
    async function enterApp(forcePicker = false) {
      hide(document.getElementById("login-view"));
      hide(document.getElementById("app-view"));
      let guilds = [];
      try {
        const data = await api("/api/tenants");
        guilds = data.tenants || [];
      } catch (e) {
        logout();
        return;
      }
      if (guilds.length === 1 && !forcePicker) {
        selectGuild(guilds[0]);
        return;
      }
      const listEl = document.getElementById("guild-list");
      listEl.textContent = "";
      for (const t of guilds) {
        const btn = document.createElement("button");
        btn.className = "secondary";
        btn.style.cssText = "width:100%;margin-bottom:0.5rem;text-align:left";
        btn.textContent = t.name + " ";
        const roleSpan = document.createElement("span");
        roleSpan.style.cssText = "color:var(--muted);font-size:0.8rem";
        roleSpan.textContent = "(" + (t.role || "member") + ")";
        btn.appendChild(roleSpan);
        btn.addEventListener("click", () => selectGuild(t));
        listEl.appendChild(btn);
      }
      document.getElementById("guild-create-intro").textContent = guilds.length
        ? "Or create another guild:"
        : "Create a guild to get started.";
      show(document.getElementById("guild-view"));
    }

    async function createGuild() {
      const errEl = document.getElementById("guild-error");
      hide(errEl);
      const name = document.getElementById("guild-name").value.trim();
      const slug = document.getElementById("guild-slug").value.trim();
      if (!name || !slug) {
        errEl.textContent = "Name and web address are required.";
        show(errEl);
        return;
      }
      try {
        const t = await api("/api/tenants", {
          method: "POST",
          body: JSON.stringify({ name, slug }),
        });
        selectGuild(t);
      } catch (e) {
        errEl.textContent = e.message;
        show(errEl);
      }
    }

    function initApp() {
      if (!token || !tenantId) {
        show(document.getElementById("login-view"));
        hide(document.getElementById("app-view"));
        return;
      }
      hide(document.getElementById("login-view"));
      show(document.getElementById("app-view"));
      document.getElementById("tenant-label").textContent = tenantName || tenantSlug || "";
      navigate("dashboard");
    }

    document.querySelectorAll(".sidebar nav a").forEach((a) => {
      a.addEventListener("click", (e) => {
        e.preventDefault();
        document.querySelectorAll(".sidebar nav a").forEach((x) => x.classList.remove("active"));
        a.classList.add("active");
        navigate(a.dataset.page);
      });
    });

    async function navigate(page) {
      const el = document.getElementById("page-content");
      el.innerHTML = "<p style='color:var(--muted)'>Loading…</p>";
      try {
        if (page === "dashboard") await renderDashboard(el);
        else if (page === "members") await renderMembers(el);
        else if (page === "levels") await renderLevels(el);
        else if (page === "events") await renderEvents(el);
        else if (page === "settings") renderSettings(el);
      } catch (e) {
        el.innerHTML = `<p class="error">${e.message}</p>`;
      }
    }

    async function renderDashboard(el) {
      const [members, events, levels] = await Promise.all([
        api(`/api/tenants/${tenantId}/members`),
        api(`/api/tenants/${tenantId}/events?upcoming=1`),
        api(`/api/tenants/${tenantId}/levels`),
      ]);
      const active = members.filter((m) => m.status === "active").length;
      el.innerHTML = `
        <h2>Dashboard</h2>
        <div class="stats">
          <div class="stat"><div class="label">Active Members</div><div class="value">${active}</div></div>
          <div class="stat"><div class="label">Total Members</div><div class="value">${members.length}</div></div>
          <div class="stat"><div class="label">Upcoming Events</div><div class="value">${events.length}</div></div>
          <div class="stat"><div class="label">Membership Levels</div><div class="value">${levels.length}</div></div>
        </div>
        <div class="card">
          <h3 style="margin-bottom:0.75rem">Upcoming Events</h3>
          ${events.length === 0 ? "<p style='color:var(--muted)'>No upcoming events</p>" : `
            <table>
              <thead><tr><th>Event</th><th>Date</th><th>Location</th></tr></thead>
              <tbody>
                ${events.slice(0, 5).map((e) => `
                  <tr>
                    <td>${esc(e.title)}</td>
                    <td>${new Date(e.start_at).toLocaleDateString()}</td>
                    <td>${esc(e.location || "—")}</td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          `}
        </div>
      `;
    }

    async function renderMembers(el) {
      const members = await api(`/api/tenants/${tenantId}/members`);
      el.innerHTML = `
        <h2>Members</h2>
        <div class="toolbar">
          <input type="search" id="member-search" placeholder="Search…" oninput="filterMembers()" />
          <button onclick="showAddMember()">Add Member</button>
        </div>
        <div id="add-member-form" class="card hidden">
          <div class="form-row">
            <div><label>Email</label><input id="m-email" type="email" /></div>
            <div><label>First Name</label><input id="m-first" /></div>
          </div>
          <div class="form-row">
            <div><label>Last Name</label><input id="m-last" /></div>
            <div><label>Status</label>
              <select id="m-status">
                <option value="pending">Pending</option>
                <option value="active">Active</option>
              </select>
            </div>
          </div>
          <button onclick="addMember()">Save</button>
          <button class="secondary" onclick="hideAddMember()">Cancel</button>
        </div>
        <div class="card">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Joined</th></tr></thead>
            <tbody id="members-tbody">
              ${members.map((m) => `
                <tr data-search="${esc((m.first_name||'') + ' ' + (m.last_name||'') + ' ' + m.email).toLowerCase()}">
                  <td>${esc([m.first_name, m.last_name].filter(Boolean).join(" ") || "—")}</td>
                  <td>${esc(m.email)}</td>
                  <td><span class="badge ${m.status}">${m.status}</span></td>
                  <td>${m.joined_at ? new Date(m.joined_at).toLocaleDateString() : "—"}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function filterMembers() {
      const q = document.getElementById("member-search").value.toLowerCase();
      document.querySelectorAll("#members-tbody tr").forEach((tr) => {
        tr.style.display = tr.dataset.search.includes(q) ? "" : "none";
      });
    }
    function showAddMember() { show(document.getElementById("add-member-form")); }
    function hideAddMember() { hide(document.getElementById("add-member-form")); }
    async function addMember() {
      await api(`/api/tenants/${tenantId}/members`, {
        method: "POST",
        body: JSON.stringify({
          email: document.getElementById("m-email").value,
          first_name: document.getElementById("m-first").value,
          last_name: document.getElementById("m-last").value,
          status: document.getElementById("m-status").value,
        }),
      });
      navigate("members");
    }

    async function renderLevels(el) {
      const levels = await api(`/api/tenants/${tenantId}/levels`);
      el.innerHTML = `
        <h2>Membership Levels</h2>
        <div class="toolbar"><button onclick="showAddLevel()">Add Level</button></div>
        <div id="add-level-form" class="card hidden">
          <div class="form-row">
            <div><label>Name</label><input id="l-name" placeholder="Individual" /></div>
            <div><label>Price (cents)</label><input id="l-price" type="number" value="3500" /></div>
          </div>
          <div class="form-row">
            <div><label>Duration (months)</label><input id="l-duration" type="number" value="12" /></div>
            <div><label>Renewal</label>
              <select id="l-renewal"><option value="manual">Manual</option><option value="auto">Auto</option></select>
            </div>
          </div>
          <button onclick="addLevel()">Save</button>
          <button class="secondary" onclick="hide(document.getElementById('add-level-form'))">Cancel</button>
        </div>
        <div class="card">
          <table>
            <thead><tr><th>Name</th><th>Price</th><th>Duration</th><th>Renewal</th></tr></thead>
            <tbody>
              ${levels.map((l) => `
                <tr>
                  <td>${esc(l.name)}</td>
                  <td>$${(l.price_cents / 100).toFixed(2)}</td>
                  <td>${l.duration_months} mo</td>
                  <td>${l.renewal_type}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }
    function showAddLevel() { show(document.getElementById("add-level-form")); }
    async function addLevel() {
      await api(`/api/tenants/${tenantId}/levels`, {
        method: "POST",
        body: JSON.stringify({
          name: document.getElementById("l-name").value,
          price_cents: Number(document.getElementById("l-price").value),
          duration_months: Number(document.getElementById("l-duration").value),
          renewal_type: document.getElementById("l-renewal").value,
        }),
      });
      navigate("levels");
    }

    async function renderEvents(el) {
      const events = await api(`/api/tenants/${tenantId}/events`);
      el.innerHTML = `
        <h2>Events</h2>
        <div class="toolbar"><button onclick="showAddEvent()">Add Event</button></div>
        <div id="add-event-form" class="card hidden">
          <label>Title</label><input id="e-title" />
          <div class="form-row">
            <div><label>Start</label><input id="e-start" type="datetime-local" /></div>
            <div><label>Location</label><input id="e-location" /></div>
          </div>
          <div class="form-row">
            <div><label>Member price (cents)</label><input id="e-mprice" type="number" value="0" /></div>
            <div><label>Non-member price (cents)</label><input id="e-nmprice" type="number" value="0" /></div>
          </div>
          <button onclick="addEvent()">Save</button>
          <button class="secondary" onclick="hide(document.getElementById('add-event-form'))">Cancel</button>
        </div>
        <div class="card">
          <table>
            <thead><tr><th>Title</th><th>Date</th><th>Location</th><th>Member $</th><th>Public $</th></tr></thead>
            <tbody>
              ${events.map((e) => `
                <tr>
                  <td><a href="#" onclick="viewRegistrations('${e.id}');return false">${esc(e.title)}</a></td>
                  <td>${new Date(e.start_at).toLocaleString()}</td>
                  <td>${esc(e.location || "—")}</td>
                  <td>$${(e.member_price_cents / 100).toFixed(2)}</td>
                  <td>$${(e.non_member_price_cents / 100).toFixed(2)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
        <div id="regs-panel"></div>
      `;
    }
    function showAddEvent() { show(document.getElementById("add-event-form")); }
    async function addEvent() {
      const start = document.getElementById("e-start").value;
      await api(`/api/tenants/${tenantId}/events`, {
        method: "POST",
        body: JSON.stringify({
          title: document.getElementById("e-title").value,
          start_at: new Date(start).toISOString(),
          location: document.getElementById("e-location").value,
          member_price_cents: Number(document.getElementById("e-mprice").value),
          non_member_price_cents: Number(document.getElementById("e-nmprice").value),
        }),
      });
      navigate("events");
    }
    async function viewRegistrations(eventId) {
      const regs = await api(`/api/tenants/${tenantId}/events/${eventId}/registrations`);
      document.getElementById("regs-panel").innerHTML = `
        <div class="card" style="margin-top:1rem">
          <h3 style="margin-bottom:0.75rem">Registrations</h3>
          ${regs.length === 0 ? "<p style='color:var(--muted)'>No registrations yet</p>" : `
            <table>
              <thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Ticket</th><th></th></tr></thead>
              <tbody>
                ${regs.map((r) => `
                  <tr>
                    <td>${esc(r.name || "—")}</td>
                    <td>${esc(r.email)}</td>
                    <td><span class="badge ${r.status}">${r.status}</span></td>
                    <td><code>${r.ticket_code || "—"}</code></td>
                    <td>
                      ${r.status === "registered" ? `<button onclick="checkIn('${eventId}','${r.id}')">Check in</button>` : ""}
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          `}
        </div>
      `;
    }
    async function checkIn(eventId, regId) {
      await api(`/api/tenants/${tenantId}/events/${eventId}/check-in`, {
        method: "POST",
        body: JSON.stringify({ registration_id: regId }),
      });
      viewRegistrations(eventId);
    }

    function renderSettings(el) {
      el.innerHTML = `
        <h2>Settings</h2>
        <div class="card">
          <p><strong>Guild:</strong> ${esc(tenantName || tenantSlug)}</p>
          <p style="margin-top:0.5rem"><strong>Public links:</strong> <code>${API}/public/${esc(tenantSlug)}/…</code></p>
          <p style="margin-top:1rem;color:var(--muted);font-size:0.9rem">
            <button class="secondary" onclick="switchTenant()">Switch guild</button>
            <button class="secondary" onclick="logout()" style="margin-left:0.5rem">Log out</button>
          </p>
        </div>
      `;
    }
    function switchTenant() {
      enterApp(true);
    }
    function logout() {
      localStorage.removeItem("gb_token");
      localStorage.removeItem("gb_tenant_id");
      localStorage.removeItem("gb_tenant_slug");
      localStorage.removeItem("gb_tenant_name");
      token = null;
      tenantId = null;
      tenantSlug = "";
      tenantName = "";
      hide(document.getElementById("guild-view"));
      hide(document.getElementById("app-view"));
      show(document.getElementById("login-view"));
    }

    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s ?? "";
      return d.innerHTML;
    }

    // Google OAuth hand-off: token or error arrives in the URL hash
    if (location.hash.startsWith("#gtoken=")) {
      token = decodeURIComponent(location.hash.slice(8));
      localStorage.setItem("gb_token", token);
      history.replaceState(null, "", location.pathname);
    } else if (location.hash.startsWith("#gerror=")) {
      const msg = decodeURIComponent(location.hash.slice(8));
      history.replaceState(null, "", location.pathname);
      const errEl = document.getElementById("login-error");
      errEl.textContent = msg;
      show(errEl);
    }

    // Hide the password form when the server requires Google sign-in
    fetch(API + "/api/auth/config")
      .then((r) => r.json())
      .then((cfg) => {
        if (cfg.google_required) hide(document.getElementById("password-login"));
      })
      .catch(() => {});

    // Boot
    if (token && tenantId) initApp();
    else if (token) enterApp();
    else show(document.getElementById("login-view"));
  </script>
</body>
</html>
