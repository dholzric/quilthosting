<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuiltHosting Admin</title>
  <style>
    :root { --accent: #c45c26; --bg: #faf8f5; --border: #e5e0d8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: #1a1a1a; }
    header { background: #2c1810; color: #f5e6d3; padding: 1rem 1.5rem; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; }
    input, button { padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.95rem; }
    input { width: 100%; border: 1px solid var(--border); margin-bottom: 0.75rem; }
    button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid var(--border); }
    .error { color: #9b2226; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header><h1>QuiltHosting Admin</h1></header>
  <div class="wrap">
    <div id="login" class="card">
      <h2>Sign in</h2>
      <p id="login-err" class="error hidden"></p>
      <label>API base</label>
      <input id="api" value="http://localhost:8787" />
      <label>Email</label>
      <input id="email" type="email" />
      <label>Password</label>
      <input id="password" type="password" />
      <label>Tenant ID</label>
      <input id="tenant" placeholder="from POST /api/tenants" />
      <button onclick="login()">Sign in</button>
    </div>
    <div id="app" class="hidden">
      <div class="card">
        <h2>Dashboard</h2>
        <p id="stats">Loading…</p>
        <button onclick="loadMembers()">Refresh members</button>
      </div>
      <div class="card">
        <h2>Members</h2>
        <div id="members"></div>
      </div>
    </div>
  </div>
  <script>
    let token = localStorage.getItem('qh_token');
    let tenantId = localStorage.getItem('qh_tenant');
    const api = () => document.getElementById('api').value.replace(/\/$/, '');
    async function req(path, opts = {}) {
      const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
      if (token) headers.Authorization = 'Bearer ' + token;
      const res = await fetch(api() + path, { ...opts, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }
    async function login() {
      const err = document.getElementById('login-err');
      err.classList.add('hidden');
      try {
        const data = await req('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        token = data.token;
        tenantId = document.getElementById('tenant').value.trim();
        localStorage.setItem('qh_token', token);
        localStorage.setItem('qh_tenant', tenantId);
        showApp();
      } catch (e) {
        err.textContent = e.message;
        err.classList.remove('hidden');
      }
    }
    async function showApp() {
      document.getElementById('login').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      loadMembers();
    }
    async function loadMembers() {
      try {
        const members = await req('/api/tenants/' + tenantId + '/members');
        const levels = await req('/api/tenants/' + tenantId + '/levels');
        const events = await req('/api/tenants/' + tenantId + '/events?upcoming=1');
        document.getElementById('stats').textContent =
          members.length + ' members · ' + levels.length + ' levels · ' + events.length + ' upcoming events';
        document.getElementById('members').innerHTML =
          '<table><thead><tr><th>Name</th><th>Email</th><th>Status</th></tr></thead><tbody>' +
          members.map(m => '<tr><td>' + [m.first_name, m.last_name].filter(Boolean).join(' ') +
            '</td><td>' + m.email + '</td><td>' + m.status + '</td></tr>').join('') +
          '</tbody></table>';
      } catch (e) {
        document.getElementById('stats').textContent = e.message;
      }
    }
    if (token && tenantId) {
      document.getElementById('tenant').value = tenantId;
      showApp();
    }
  </script>
</body>
</html>
