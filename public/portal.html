<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Member Portal – QuiltHosting</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b5501f'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23faf7f2'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/qh.css" />
  <style>
    :root {
      --muted: var(--ink-3);
      --success: var(--ok);
      --text: var(--ink);
      --bg: var(--paper);
      --accent: var(--brand);
    }
    .event-item { border-bottom: 1px solid var(--border); padding: 0.85rem 0; }
    .event-item:last-child { border-bottom: none; }
  </style>
</head>
<body class="has-fleet-footer">
  <header class="portal-header">
    <div class="inner">
      <h1><a href="/" style="color:inherit;text-decoration:none" title="QuiltHosting home"><span style="color:var(--gold)">✦</span></a> <span id="guild-title">Member Portal</span></h1>
      <div class="row" style="justify-content:flex-end">
        <span id="user-email" style="color:#a89a83;font-size:0.85rem"></span>
        <a href="#" id="switch-guild-btn" class="hidden" onclick="switchGuild();return false">Switch guild</a>
        <a href="#" id="logout-btn" class="hidden">Sign out</a>
      </div>
    </div>
  </header>

  <div class="wrap">
    <!-- Login -->
    <div id="login-view" class="card">
      <h2>Sign in</h2>
      <p class="muted" style="margin-bottom:1rem">Use the email associated with your guild membership.</p>
      <div id="login-error" class="error hidden"></div>
      <label>Email</label>
      <input type="email" id="login-email" placeholder="you@example.com" />
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" />
      <div class="row" style="margin-top:0.5rem">
        <button onclick="doLogin()">Sign in</button>
        <button class="secondary" onclick="doMagicLink()">Email me a login link</button>
      </div>
      <p class="muted" style="margin-top:1rem;font-size:0.8rem">
        <span id="slug-display" class="hidden"></span>
      </p>
    </div>

    <!-- Portal -->
    <div id="portal-view" class="hidden">
      <div class="tabs">
        <button class="active" data-tab="home" onclick="showTab('home')">Home</button>
        <button data-tab="events" onclick="showTab('events')">Events</button>
        <button data-tab="invoices" onclick="showTab('invoices')">Invoices</button>
        <button data-tab="documents" onclick="showTab('documents')">Documents</button>
        <button data-tab="directory" onclick="showTab('directory')">Directory</button>
        <button data-tab="pages" onclick="showTab('pages')">Guild Info</button>
        <button data-tab="profile" onclick="showTab('profile')">Profile</button>
      </div>

      <div id="tab-home"></div>
      <div id="tab-events" class="hidden"></div>
      <div id="tab-invoices" class="hidden"></div>
      <div id="tab-documents" class="hidden"></div>
      <div id="tab-directory" class="hidden"></div>
      <div id="tab-pages" class="hidden"></div>
      <div id="tab-profile" class="hidden"></div>
    </div>
  </div>

  <script>
    const API = window.location.origin.includes("8787") || window.location.protocol === "file:"
      ? (localStorage.getItem("gb_api") || "http://localhost:8787")
      : window.location.origin;

    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug") || localStorage.getItem("gb_portal_slug") || "";
    let token = localStorage.getItem("gb_token");

    // Magic-link hand-off: /auth/verify redirects here with #ptoken=<jwt>
    if (location.hash.startsWith("#ptoken=")) {
      token = decodeURIComponent(location.hash.slice(8));
      localStorage.setItem("gb_token", token);
      history.replaceState(null, "", location.pathname + location.search);
    }

    document.getElementById("slug-display").textContent = slug || "(none)";
    if (slug) localStorage.setItem("gb_portal_slug", slug);

    if (params.get("renewed") === "1") {
      // Will show after load
    }

    async function api(path, opts = {}) {
      const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
      if (token) headers["Authorization"] = `Bearer ${token}`;
      const res = await fetch(API + path, { ...opts, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function show(el) { el.classList.remove("hidden"); }
    function hide(el) { el.classList.add("hidden"); }
    function esc(s) {
      const d = document.createElement("div");
      d.textContent = s ?? "";
      return d.innerHTML;
    }
    function money(cents) {
      return "$" + ((cents || 0) / 100).toFixed(2);
    }

    async function doLogin() {
      const err = document.getElementById("login-error");
      hide(err);
      try {
        const data = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({
            email: document.getElementById("login-email").value,
            password: document.getElementById("login-password").value,
          }),
        });
        token = data.token;
        localStorage.setItem("gb_token", token);
        await loadPortal();
      } catch (e) {
        err.textContent = e.message;
        show(err);
      }
    }

    async function doMagicLink() {
      const err = document.getElementById("login-error");
      hide(err);
      const email = document.getElementById("login-email").value;
      if (!email) {
        err.textContent = "Enter your email first";
        show(err);
        return;
      }
      try {
        await api("/api/auth/magic-link", {
          method: "POST",
          body: JSON.stringify({ email, guildSlug: slug }),
        });
        err.style.color = "var(--success)";
        err.textContent = "Check your email for a login link.";
        show(err);
      } catch (e) {
        err.style.color = "#9b2226";
        err.textContent = e.message;
        show(err);
      }
    }

    function switchGuild() {
      localStorage.removeItem("gb_portal_slug");
      location.href = "/portal";
    }

    document.getElementById("logout-btn").addEventListener("click", (e) => {
      e.preventDefault();
      localStorage.removeItem("gb_token");
      token = null;
      location.reload();
    });

    function showTab(name) {
      ["home", "events", "invoices", "documents", "directory", "pages", "profile"].forEach((t) => {
        const panel = document.getElementById("tab-" + t);
        const btn = document.querySelector(`.tabs button[data-tab="${t}"]`);
        if (t === name) {
          show(panel);
          btn.classList.add("active");
        } else {
          hide(panel);
          btn.classList.remove("active");
        }
      });
      if (name === "events") loadEvents();
      if (name === "invoices") loadInvoices();
      if (name === "documents") loadDocuments();
      if (name === "directory") loadDirectory();
      if (name === "pages") loadGuildPages();
      if (name === "profile") loadProfile();
    }

    function elBuild(tag, className, text) {
      const n = document.createElement(tag);
      if (className) n.className = className;
      if (text !== undefined) n.textContent = text;
      return n;
    }

    async function loadDocuments() {
      const el = document.getElementById("tab-documents");
      el.replaceChildren(elBuild("p", "muted", "Loading…"));
      try {
        const [files, newsletters] = await Promise.all([
          api(`/api/portal/${slug}/files`),
          api(`/api/portal/${slug}/newsletters`).catch(() => []),
        ]);
        el.replaceChildren();

        // Newsletters, readable online
        if (newsletters.length) {
          const nCard = elBuild("div", "card");
          nCard.appendChild(elBuild("h3", "", "Newsletters"));
          for (const n of newsletters) {
            const row = elBuild("div");
            row.style.cssText = "display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:0.55rem 0;border-bottom:1px solid var(--border)";
            const left = elBuild("div");
            left.appendChild(elBuild("strong", "", n.subject));
            left.appendChild(elBuild("div", "muted", new Date(n.created_at).toLocaleDateString(undefined, { dateStyle: "long" })));
            const btn = elBuild("button", "secondary", "Read");
            btn.addEventListener("click", () => {
              let frameWrap = row.nextElementSibling;
              if (frameWrap && frameWrap.dataset.frameFor === n.id) {
                frameWrap.remove();
                btn.textContent = "Read";
                return;
              }
              document.querySelectorAll("[data-frame-for]").forEach((x) => x.remove());
              frameWrap = elBuild("div");
              frameWrap.dataset.frameFor = n.id;
              frameWrap.style.cssText = "border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:0.5rem 0 0.75rem";
              const frame = document.createElement("iframe");
              frame.setAttribute("sandbox", "");
              frame.srcdoc = n.body_html;
              frame.style.cssText = "width:100%;height:420px;border:none;background:#fff";
              frameWrap.appendChild(frame);
              row.after(frameWrap);
              btn.textContent = "Close";
            });
            row.append(left, btn);
            nCard.appendChild(row);
          }
          el.appendChild(nCard);
        }

        if (!files.length && !newsletters.length) {
          el.replaceChildren(elBuild("p", "muted", "No documents shared yet."));
          return;
        }
        if (!files.length) return;
        const card = elBuild("div", "card");
        card.appendChild(elBuild("h3", "", "Documents"));
        const table = elBuild("table");
        const thead = elBuild("thead");
        const hr = elBuild("tr");
        for (const h of ["File", "Size", "Added"]) hr.appendChild(elBuild("th", "", h));
        thead.appendChild(hr);
        const tbody = elBuild("tbody");
        for (const f of files) {
          const tr = elBuild("tr");
          const tdName = elBuild("td");
          const a = elBuild("a", "", f.filename);
          a.href = `${API}/api/portal/${slug}/files/${f.id}?token=${encodeURIComponent(token)}`;
          tdName.appendChild(a);
          tr.appendChild(tdName);
          tr.appendChild(elBuild("td", "", f.size ? (f.size / 1024).toFixed(0) + " KB" : "—"));
          tr.appendChild(elBuild("td", "", new Date(f.created_at).toLocaleDateString()));
          tbody.appendChild(tr);
        }
        table.append(thead, tbody);
        card.appendChild(table);
        el.appendChild(card);
      } catch (e) {
        el.replaceChildren(elBuild("p", "muted", e.message));
      }
    }

    async function loadDirectory() {
      const el = document.getElementById("tab-directory");
      el.replaceChildren(elBuild("p", "muted", "Loading…"));
      try {
        const data = await api(`/api/portal/${slug}/directory`);
        if (!data.members.length) { el.replaceChildren(elBuild("p", "muted", "No members to show.")); return; }
        const card = elBuild("div", "card");
        const table = elBuild("table");
        const thead = elBuild("thead");
        const hr = elBuild("tr");
        for (const h of ["Name", "Member since"]) hr.appendChild(elBuild("th", "", h));
        thead.appendChild(hr);
        const tbody = elBuild("tbody");
        for (const m of data.members) {
          const tr = elBuild("tr");
          tr.appendChild(elBuild("td", "", [m.first_name, m.last_name].filter(Boolean).join(" ") || "(name not shared)"));
          tr.appendChild(elBuild("td", "", m.joined_at ? new Date(m.joined_at).toLocaleDateString() : "—"));
          tbody.appendChild(tr);
        }
        table.append(thead, tbody);
        card.appendChild(table);
        el.replaceChildren(card);
      } catch (e) {
        el.replaceChildren(elBuild("p", "muted", e.message));
      }
    }

    async function loadGuildPages() {
      const el = document.getElementById("tab-pages");
      el.replaceChildren(elBuild("p", "muted", "Loading…"));
      try {
        const pages = await api(`/api/portal/${slug}/pages`);
        if (!pages.length) { el.replaceChildren(elBuild("p", "muted", "No guild info pages yet.")); return; }
        el.replaceChildren();
        for (const p of pages) {
          const card = elBuild("div", "card");
          const h = elBuild("h3", "", p.title + (p.is_members_only ? " (members only)" : ""));
          const body = elBuild("div");
          // Intentional: page content is HTML authored by this guild's own
          // admins in the page editor (CMS trust model, not user input).
          body.innerHTML = (JSON.parse(p.content_json || "{}").html) || "";
          card.append(h, body);
          el.appendChild(card);
        }
      } catch (e) {
        el.replaceChildren(elBuild("p", "muted", e.message));
      }
    }

    async function loadPortal() {
      if (!slug) {
        alert("Add ?slug=yourguild to the URL");
        return;
      }
      if (!token) {
        show(document.getElementById("login-view"));
        hide(document.getElementById("portal-view"));
        return;
      }
      try {
        const data = await api(`/api/portal/${slug}/me`);
        hide(document.getElementById("login-view"));
        show(document.getElementById("portal-view"));
        show(document.getElementById("logout-btn"));
        show(document.getElementById("switch-guild-btn"));
        document.getElementById("guild-title").textContent = data.tenant.name;
        document.getElementById("user-email").textContent = data.user?.email || "";

        const home = document.getElementById("tab-home");
        if (!data.member) {
          home.innerHTML = `
            <div class="card">
              <h2>Welcome</h2>
              <p>You're signed in as <strong>${esc(data.user?.email || "")}</strong>, but you're not a member of <strong>${esc(data.tenant.name)}</strong> yet.</p>
              <div class="row" style="margin-top:1rem;justify-content:flex-start">
                <a class="btn" href="/g/${esc(slug)}">Join ${esc(data.tenant.name)}</a>
                <button class="secondary" onclick="switchGuild()">Choose a different guild</button>
              </div>
            </div>`;
          return;
        }

        const m = data.membership;
        const status = m?.status || data.member.status;
        home.innerHTML = `
          <div class="card">
            <h2>Membership</h2>
            <p>
              <span class="badge ${status}">${status}</span>
              ${m ? `· <strong>${esc(m.level_name)}</strong>` : ""}
            </p>
            ${m?.end_date ? `<p class="muted" style="margin-top:0.5rem">Renews / ends: ${new Date(m.end_date).toLocaleDateString()}</p>` : ""}
            <div class="row" style="margin-top:1rem">
              <button onclick="doRenew()">Renew membership</button>
            </div>
            ${params.get("renewed") === "1" ? `<p style="color:var(--success);margin-top:0.75rem">Renewal payment received — thank you!</p>` : ""}
          </div>
          <div class="card">
            <h2>Hello${data.member.first_name ? ", " + esc(data.member.first_name) : ""}</h2>
            <p class="muted">Use the tabs above to view events, invoices, and update your profile.</p>
          </div>`;
      } catch (e) {
        if (String(e.message).includes("Unauthorized") || String(e.message).includes("Invalid")) {
          localStorage.removeItem("gb_token");
          token = null;
          location.reload();
          return;
        }
        // Signed in, but this guild doesn't work for them (wrong or missing
        // web address, not a member, etc.) — never show the login form.
        hide(document.getElementById("login-view"));
        hide(document.getElementById("portal-view"));
        show(document.getElementById("logout-btn"));
        show(document.getElementById("switch-guild-btn"));
        let box = document.getElementById("portal-problem");
        if (!box) {
          box = document.createElement("div");
          box.id = "portal-problem";
          box.className = "card";
          document.querySelector(".wrap").appendChild(box);
        }
        box.innerHTML = `
          <h2>Hmm, we couldn't open that guild</h2>
          <p class="muted">${esc(e.message)} — the guild web address saved on this device may be wrong.</p>
          <div class="row" style="margin-top:1rem;justify-content:flex-start">
            <button onclick="switchGuild()">Choose your guild</button>
            <button class="secondary" onclick="localStorage.removeItem('gb_token');location.reload()">Sign out</button>
          </div>`;
        box.classList.remove("hidden");
      }
    }

    async function doRenew() {
      try {
        const data = await api(`/api/portal/${slug}/renew`, {
          method: "POST",
          body: JSON.stringify({}),
        });
        if (data.status === "checkout" && data.checkout_url) {
          window.location.href = data.checkout_url;
        } else if (data.status === "active") {
          alert("Membership renewed!");
          loadPortal();
        }
      } catch (e) {
        alert(e.message);
      }
    }

    async function loadEvents() {
      const el = document.getElementById("tab-events");
      el.innerHTML = "<p class='muted'>Loading…</p>";
      try {
        const data = await api(`/api/portal/${slug}/events`);
        const regMap = {};
        (data.my_registrations || []).forEach((r) => {
          regMap[r.event_id] = r;
        });
        if (!data.events.length) {
          el.innerHTML = `<div class="card"><p class="muted">No upcoming events.</p></div>`;
          return;
        }
        el.innerHTML = `
          <div class="card">
            <h2>Upcoming events</h2>
            ${data.events.map((e) => {
              const reg = regMap[e.id];
              const price = data.is_member ? e.member_price_cents : e.non_member_price_cents;
              return `
                <div class="event-item">
                  <strong>${esc(e.title)}</strong>
                  <div class="muted">${new Date(e.start_at).toLocaleString()}${e.location ? " · " + esc(e.location) : ""}</div>
                  <div class="row" style="margin-top:0.5rem">
                    <span class="muted">${money(price)}</span>
                    ${reg
                      ? `<span class="badge ${reg.status}">${reg.status}</span>${reg.ticket_code ? ` <code>${reg.ticket_code}</code>` : ""}`
                      : e.registration_open
                        ? `<button onclick="registerEvent('${e.id}', ${data.is_member})">Register</button>`
                        : `<span class="muted">Closed</span>`}
                  </div>
                </div>`;
            }).join("")}
          </div>`;
      } catch (e) {
        el.innerHTML = `<p class="error">${esc(e.message)}</p>`;
      }
    }

    async function registerEvent(eventId, isMember) {
      try {
        // Need email from profile
        const me = await api(`/api/portal/${slug}/me`);
        const data = await api(`/public/${slug}/events/${eventId}/register`, {
          method: "POST",
          body: JSON.stringify({
            email: me.user?.email || me.member?.email,
            name: [me.member?.first_name, me.member?.last_name].filter(Boolean).join(" ") || undefined,
            member_id: me.member?.id,
            is_member: !!isMember,
          }),
        });
        if (data.status === "checkout" && data.checkout_url) {
          window.location.href = data.checkout_url;
        } else {
          alert(data.message || "Registered!");
          loadEvents();
        }
      } catch (e) {
        alert(e.message);
      }
    }

    async function loadInvoices() {
      const el = document.getElementById("tab-invoices");
      el.innerHTML = "<p class='muted'>Loading…</p>";
      try {
        const data = await api(`/api/portal/${slug}/invoices`);
        if (!data.invoices?.length) {
          el.innerHTML = `<div class="card"><p class="muted">No payments yet.</p></div>`;
          return;
        }
        el.innerHTML = `
          <div class="card">
            <h2>Payment history</h2>
            <table>
              <thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead>
              <tbody>
                ${data.invoices.map((i) => `
                  <tr>
                    <td>${new Date(i.created_at).toLocaleDateString()}</td>
                    <td>${esc(i.type)}</td>
                    <td>${money(i.amount_cents)}</td>
                    <td><span class="badge ${i.status === "succeeded" ? "active" : "pending"}">${i.status}</span></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>`;
      } catch (e) {
        el.innerHTML = `<p class="error">${esc(e.message)}</p>`;
      }
    }

    async function loadProfile() {
      const el = document.getElementById("tab-profile");
      el.innerHTML = "<p class='muted'>Loading…</p>";
      try {
        const data = await api(`/api/portal/${slug}/me`);
        const m = data.member;
        if (!m) {
          el.innerHTML = `<div class="card"><p class="muted">No member profile.</p></div>`;
          return;
        }
        el.innerHTML = `
          <div class="card">
            <h2>Your profile</h2>
            <label>First name</label>
            <input id="p-first" value="${esc(m.first_name || "")}" />
            <label>Last name</label>
            <input id="p-last" value="${esc(m.last_name || "")}" />
            <label>Phone</label>
            <input id="p-phone" value="${esc(m.phone || "")}" />
            <label>Email</label>
            <input value="${esc(m.email)}" disabled />
            <div id="p-custom"></div>
            <button onclick="saveProfile()" style="margin-top:0.5rem">Save</button>
            <span id="profile-msg" class="muted" style="margin-left:0.75rem"></span>
          </div>`;
        // Guild-defined fields
        try {
          const info = await (await fetch(`${API}/public/${slug}/info`)).json();
          const box = document.getElementById("p-custom");
          let vals = {};
          try { vals = JSON.parse(m.custom_fields_json || "{}"); } catch {}
          for (const f of info.join_fields || []) {
            const label = document.createElement("label");
            label.textContent = f.label;
            box.appendChild(label);
            let input;
            if (f.type === "select") {
              input = document.createElement("select");
              const blank = document.createElement("option");
              blank.value = ""; blank.textContent = "—";
              input.appendChild(blank);
              for (const o of f.options || []) {
                const opt = document.createElement("option");
                opt.value = o; opt.textContent = o;
                input.appendChild(opt);
              }
            } else {
              input = document.createElement("input");
            }
            input.dataset.cfKey = f.key;
            input.value = vals[f.key] || "";
            box.appendChild(input);
          }
        } catch {}
      } catch (e) {
        el.innerHTML = `<p class="error">${esc(e.message)}</p>`;
      }
    }

    async function saveProfile() {
      try {
        const custom = {};
        document.querySelectorAll("#p-custom [data-cf-key]").forEach((i) => {
          custom[i.dataset.cfKey] = i.value;
        });
        await api(`/api/portal/${slug}/profile`, {
          method: "PATCH",
          body: JSON.stringify({
            first_name: document.getElementById("p-first").value,
            last_name: document.getElementById("p-last").value,
            phone: document.getElementById("p-phone").value,
            custom_fields: custom,
          }),
        });
        document.getElementById("profile-msg").textContent = "Saved.";
      } catch (e) {
        document.getElementById("profile-msg").textContent = e.message;
      }
    }

    // No slug in the URL: find the guilds this signed-in email belongs to,
    // or ask which guild they're looking for.
    async function pickGuild() {
      const box = document.getElementById("login-view");
      show(box);
      if (token) {
        try {
          const data = await api("/api/portal/guilds");
          if (data.guilds.length === 1) {
            location.replace(`/portal?slug=${encodeURIComponent(data.guilds[0].slug)}`);
            return;
          }
          if (data.guilds.length > 1) {
            box.replaceChildren();
            const h = document.createElement("h2");
            h.textContent = "Your guilds";
            box.appendChild(h);
            for (const g of data.guilds) {
              const b = document.createElement("button");
              b.style.cssText = "display:block;width:100%;margin-top:0.5rem;text-align:left";
              b.textContent = g.name;
              b.addEventListener("click", () =>
                location.replace(`/portal?slug=${encodeURIComponent(g.slug)}`));
              box.appendChild(b);
            }
            return;
          }
        } catch {}
      }
      // Signed out (or no memberships): ask for the guild's web address
      box.replaceChildren();
      const h = document.createElement("h2");
      h.textContent = "Which guild are you a member of?";
      const p = document.createElement("p");
      p.className = "muted";
      p.textContent = "Enter your guild's web address (ask your guild admin if unsure).";
      const input = document.createElement("input");
      input.placeholder = "e.g. test-guild";
      const btn = document.createElement("button");
      btn.style.marginTop = "0.75rem";
      btn.textContent = "Continue";
      const go = () => {
        const s = input.value.toLowerCase().trim().replace(/[^a-z0-9-]/g, "");
        if (s) location.replace(`/portal?slug=${encodeURIComponent(s)}`);
      };
      btn.addEventListener("click", go);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
      box.append(h, p, input, btn);
    }

    // Hide the unusable password login when the server is Google-only,
    // and offer Google sign-in that returns to this portal.
    fetch(API + "/api/auth/config")
      .then((r) => r.json())
      .then((cfg) => {
        if (cfg.google_required) {
          const pw = document.getElementById("login-password");
          if (pw) {
            pw.previousElementSibling.classList.add("hidden"); // label
            pw.classList.add("hidden");
          }
          document.querySelector("#login-view button:not(.secondary)")?.classList.add("hidden");
        }
        if (cfg.google) {
          const row = document.querySelector("#login-view .row");
          if (row) {
            const g = document.createElement("a");
            g.href = `/api/auth/google?dest=portal&slug=${encodeURIComponent(slug)}`;
            g.textContent = "Sign in with Google";
            g.style.cssText = "display:inline-block;padding:0.55rem 1rem;border:1px solid #ccc;border-radius:8px;text-decoration:none;color:inherit";
            row.appendChild(g);
          }
        }
      })
      .catch(() => {});

    // Boot
    if (!slug) {
      pickGuild();
    } else if (token) {
      loadPortal();
    }
  </script>
